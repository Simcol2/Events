<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6ED" />

    <!-- Defaults only. Every route's real title, description, canonical,
         and social tags are stamped in per page: into the static
         snapshots by scripts/prerender.mjs (what crawlers read) and at
         runtime by components/SeoHead.jsx (what a browsing visitor gets).
         Keep these two lines in sync with ROUTE_SEO["/"] in seo.js. -->
    <title>Event Rentals in Toronto &amp; the GTA | A Slice of G Events</title>
    <meta
      name="description"
      content="Interactive event experiences, decor and display walls available to rent for baby showers, birthdays, weddings and corporate events across Toronto and the GTA."
    />
    <link rel="canonical" href="https://asliceofg.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Toronto, Ontario" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Slice of G Events" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="Event Rentals in Toronto &amp; the GTA | A Slice of G Events" />
    <meta
      property="og:description"
      content="Interactive event experiences, decor and display walls available to rent for baby showers, birthdays, weddings and corporate events across Toronto and the GTA."
    />
    <meta property="og:url" content="https://asliceofg.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Site-wide structured data. This is the block that tells Google the
         business is local to Toronto and serves the surrounding GTA rather
         than selling nationally, which is the single highest-value signal
         a rental business can send. Generated from seo.js and injected
         here by scripts/prerender.mjs so the two can never disagree. -->
    <script type="application/ld+json" data-seo="business">{}</script>
    <script type="application/ld+json" data-seo="website">{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/SRC/main.jsx"></script>
  </body>
</html>
